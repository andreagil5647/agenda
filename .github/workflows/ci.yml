name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - run: pnpm run lint
      - run: pnpm run format:check
      - name: Check the API types match the contract
        run: pnpm run api:check
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The tests drive a real browser against the real API, which needs its database.
    # The job does not start its steps until the database answers: a container that has started is
    # not yet one that can be connected to, and the API gives up after ten seconds.
    #
    # Version 7, not 8: on some of GitHub's runners MongoDB 8 aborts as it starts, which looked like
    # an API that never came up. The API's driver supports 7. Try 8 again when the runners change.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      # The API lives in its own repository. Its develop branch is the one this repository's
      # develop is written against, so a change that needs a new API merges there first.
      - name: Check out the API
        uses: actions/checkout@v7
        with:
          repository: andreagil5647/agenda-backend
          ref: develop
          path: agenda-backend

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the API
        working-directory: agenda-backend
        run: |
          npm ci
          npm run build

      - name: Start the API
        working-directory: agenda-backend
        env:
          NODE_ENV: production
          # An address and not "localhost", which can mean IPv6 where the container listens on IPv4.
          MONGODB_URI: mongodb://127.0.0.1:27017
          CORS_ORIGINS: http://localhost:3000
          LOG_LEVEL: warn
        run: |
          node dist/server.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          api=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health; then
              echo
              exit 0
            fi
            # An API that has stopped will not start answering: say why now, not after a wait.
            if ! kill -0 "$api" 2>/dev/null; then
              echo "The API stopped before it answered. Its log:"
              cat "$GITHUB_WORKSPACE/api.log"
              exit 1
            fi
            sleep 1
          done
          echo "The API did not answer within a minute. Its log:"
          cat "$GITHUB_WORKSPACE/api.log"
          exit 1

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - name: Show the API's log
        if: failure()
        run: cat api.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
